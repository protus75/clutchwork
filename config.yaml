# Instance config (host plane; schema in clutch/docs/host-contract.md). Operator-owned: edit between runs.
# Claude, codex, and antigravity use ambient CLI login. IMPLEMENT/AUTHOR inherit models_by_tier[tier]; REVIEW pins
# claude's strongest model at every tier (diversity from codex IMPLEMENT is a preference, not a gate).
schema_version: 1
state_dir: .clutch/state
training_data: {enabled: true}
providers:
  - name: claude
    kind: cli
    package: "@anthropic-ai/claude-code"
    models_by_tier: {low: claude-sonnet-5-5, medium: claude-sonnet-5-5, high: claude-opus-5-5, max: claude-opus-5-5}
    limits: {concurrency: 1}  # stream reports total_cost_usd: no estimate needed
  - name: codex
    kind: cli
    package: "@openai/codex"
    models_by_tier: {low: gpt-6-luna, medium: gpt-6.1-terra, high: gpt-6.1-sol, max: gpt-6-astra}
    limits: {concurrency: 2, est_cost_per_call_usd: 1.00}  # stream reports no cost; flat subscription
  - name: antigravity
    kind: cli
    models_by_tier: {low: gemini-3.8-flash-low, medium: gemini-4-neon-medium, high: gemini-4-neon-high, max: gemini-4-carbon-high}
    limits: {concurrency: 1, est_cost_per_call_usd: 0.25}
routing:
  - {tier: low, surface: implement, candidates: [{provider: codex}]}
  - {tier: low, surface: author, candidates: [{provider: claude}]}
  - {tier: low, surface: review, candidates: [{provider: claude, model: claude-opus-5-5}]}
  - {tier: low, surface: requisition_review, candidates: [{provider: claude, model: claude-sonnet-5-5}]}
  - {tier: medium, surface: implement, candidates: [{provider: codex}]}
  - {tier: medium, surface: author, candidates: [{provider: claude}]}
  - {tier: medium, surface: review, candidates: [{provider: claude, model: claude-opus-5-5}]}
  - {tier: medium, surface: requisition_review, candidates: [{provider: claude, model: claude-sonnet-5-5}]}  
  - {tier: high, surface: implement, candidates: [{provider: codex}]}
  - {tier: high, surface: author, candidates: [{provider: claude}]}
  - {tier: high, surface: review, candidates: [{provider: claude, model: claude-opus-5-5}]}
  - {tier: max, surface: implement, candidates: [{provider: codex}]}
  - {tier: max, surface: author, candidates: [{provider: claude}]}
  - {tier: max, surface: review, candidates: [{provider: claude, model: claude-opus-5-5}]}
scheduler:
  parallel: {enabled: true, max_runs: 2, shared_paths: [docs/how-clutch-works.md]}
release: {publish: true, pre_build: [[uv, run, python, dev.py, ui-bundle]], packages: [{argv: [uv, run, python, dev.py, vscode-package], kept: dist/vscode-clutchwork-*.vsix}]}
review:
  autofix:
    - {code: ruff-fix, argv: [uv, run, ruff, check, --fix, --exit-zero], files: ["*.py"]}
    - {code: ruff-format, argv: [uv, run, ruff, format], files: ["*.py"]}
  mechanical:
    - code: unit
      argv: [clutch, coverage, gate, --, uv, run, python, -m, pytest, tests/unit, -p, clutch.testguard, -p, clutch.testreport, --clutch-results, .clutch/results/unit.json, --cov=clutch, --cov-branch, --cov-report=json:coverage.json, -n, auto]
      trigger: always
      severity: hard
      results: .clutch/results/unit.json
      coverage: coverage.json
      flake_coverage_argv: [uv, run, python, -m, pytest, --cov=clutch, --cov-branch, --cov-report=json:coverage.json, -n, "0"]
    - code: integration
      argv: [uv, run, python, -m, pytest, tests/integration, -p, clutch.testreport, --clutch-results, .clutch/results/integration.json, -n, auto]
      trigger: always
      severity: hard
      results: .clutch/results/integration.json
    - {code: lint, argv: [uv, run, ruff, check, .], trigger: always, severity: hard}
    - {code: format, argv: [uv, run, ruff, format, --check, .], trigger: always, severity: hard}
  coverage_map:
    argv: [uv, run, pytest, -q, --cov=clutch, --cov=eval, --cov-context=test, --cov-report=json:.clutch/coverage.json, --cov-config=coverage-map.toml]
    report: .clutch/coverage.json
merge: {}
drain:
  max_ticket_minutes: 180  # raised from the shipped 90 to admit the Phase 2 seeds' largest stuck budget (section 18)
caps:
  quarantine: 8  # owner 2026-11-22: 5 slots full (3 owned by serve-flaky-tests-deterministic); new load flakes failed every Check
  premise_bounce: 2  # a fixed ticket.md re-offers a premise park without an operator keep; the second bounce still needs one
engine_plane_safety_inventory: [clutch/specs/, clutch/gates.py, clutch/config.py, clutch/providers.py, config.yaml, test-gate.toml]

meta:
  paths:
    - {root: docs/, kind: plan}
    - {root: clutch/docs/, kind: guide}
    - {root: tests/, kind: test}
retro: {enabled: false}
