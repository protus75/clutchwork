[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "clutchwork"
version = "0.6.0"
description = "Continuously running orchestration engine that authors and runs tickets against host repos."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
images = ["pillow", "numpy", "scikit-image", "imagehash", "opencv-python-headless"]
images-embed = ["open-clip-torch", "torch"]

[project.urls]
Repository = "https://github.com/protus75/clutchwork"
Changelog = "https://github.com/protus75/clutchwork/blob/main/CHANGELOG.md"

[project.scripts]
clutch = "clutch.__main__:main"

[tool.uv.build-backend]
module-root = ""
# The distribution is clutchwork; the importable package and the console script are clutch.
module-name = "clutch"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-n auto"
# 120s leaves room for the slowest loaded test; thread also stops blocked workers and dumps stacks.
timeout = 120
timeout_method = "thread"

[tool.coverage.run]
core = "ctrace"

[dependency-groups]
dev = [
    "pillow",
    "numpy",
    "scikit-image",
    "imagehash",
    "opencv-python-headless",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout==2.5.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 200
# Ticket evidence scripts are frozen artifacts that Implement may never edit, so whole-repo ruff skips them.
extend-exclude = ["*.md", "tickets"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# Line length never blocks work (owner decision 2026-11-21).
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Shared fixture imports are required by pytest.
"tests/*" = ["F401", "F811"]
# The core template and its expected bytes are long by design.
"clutch/hostfiles.py" = ["E501"]
"tests/**/test_hostfiles.py" = ["E501"]
